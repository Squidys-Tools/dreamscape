[package]
name = "host-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Two binaries (src/main.rs and src/bin/smoke.rs), so `cargo run -p host-iced`
# without a --bin flag cannot pick one. Pick the window on every invocation,
# because README, t3.json and people all type the bare form.
default-run = "host-iced"

[dependencies]
canvas-core.workspace = true
canvas-gpu.workspace = true
canvas-app.workspace = true
# 0.14 specifically: 0.13 is on wgpu 0.19 and cannot share a device with the
# canvas renderer, which is wgpu 27. See docs/spikes/canvas-spike.md.
#
# `advanced` exposes the low-level types the Shader widget needs, `lazy` gives
# the Explorer a real virtual list.
iced = { version = "0.14", features = ["advanced"] }
iced_wgpu = "0.14"
wgpu.workspace = true
# iced_wgpu reports surface/swapchain problems through `log`. Without a logger
# installed every one of those diagnostics is silently dropped, which makes a
# non-rendering window look like a silent success.
env_logger = "0.11"
