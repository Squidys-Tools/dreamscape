[workspace]
resolver = "2"
members = [
    "crates/canvas-core",
    "crates/canvas-gpu",
    "crates/canvas-app",
    "crates/canvas-harness",
    "crates/host-iced",
    "crates/probe-surface",
    "crates/canvas-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
canvas-core = { path = "crates/canvas-core" }
canvas-gpu = { path = "crates/canvas-gpu" }
canvas-app = { path = "crates/canvas-app" }
canvas-harness = { path = "crates/canvas-harness" }
wgpu = "27"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glyphon = { git = "https://github.com/grovesNL/glyphon", rev = "de4b5b8d4e52310be8df56d82a759593920acc04" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
