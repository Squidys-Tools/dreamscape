[workspace]
resolver = "2"
members = [
    "crates/canvas-core",
    "crates/canvas-gpu",
    "crates/canvas-harness",
    "crates/host-iced",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
canvas-core = { path = "crates/canvas-core" }
canvas-gpu = { path = "crates/canvas-gpu" }
canvas-harness = { path = "crates/canvas-harness" }
wgpu = "27"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
